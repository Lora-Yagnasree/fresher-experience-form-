{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fresher Application Form</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'fresher' %}">Fresher</a>
            <a href="{% url 'experienced' %}">Experienced</a>
        </nav>
    </header>
    <main>
        <h2>Fresher Application Form</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name" name="full_name" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="mobile_number">Mobile Number:</label>
            <input type="text" id="mobile_number" name="mobile_number" pattern="[0-9]{10}" required><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea><br>

            <label for="ssc_memo">SSC Memo:</label>
            <input type="file" id="ssc_memo" name="ssc_memo" required><br>

            <label for="inter_memo">Intermediate Memo:</label>
            <input type="file" id="inter_memo" name="inter_memo" required><br>

            <label for="degree_memo">Degree Memo:</label>
            <input type="file" id="degree_memo" name="degree_memo" required><br>

            <label for="aadhar_card">Aadhar Card:</label>
            <input type="file" id="aadhar_card" name="aadhar_card" required><br>

            <label for="pan_card">PAN Card:</label>
            <input type="file" id="pan_card" name="pan_card" required><br>

            <label for="passport_photo">Passport Photo:</label>
            <input type="file" id="passport_photo" name="passport_photo" required><br>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
